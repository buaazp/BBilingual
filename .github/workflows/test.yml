name: tests

# Not run on every push, to save Actions minutes.
# Runs on: pull requests to main, version tags, or manual trigger
# (Actions tab -> tests -> Run workflow).
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
  push:
    tags: ["v*"]
  workflow_dispatch:

# A new commit on the same PR cancels the run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json examples/*.json; do
            python -m json.tool "$f" > /dev/null
          done
      - name: Run tests
        run: python -m unittest discover -s tests -v
